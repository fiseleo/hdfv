plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

base { archivesName = 'hdfv-neoforge-1.21.1' }
evaluationDependsOn(':core')
repositories {
    // JEI (Just Enough Items): its API to compile hdfv's optional plugin, the mod itself in the development runs.
    maven {
        name = 'JEI'
        url = 'https://maven.blamejared.com/'
        content {
            includeGroup 'mezz.jei'
            includeGroupByRegex 'net[.]mezzdev([.].*)?'   // JEI's config library
        }
    }
    // 0.23: Create in the development runs (it carries Registrate, Flywheel and Ponder inside its JAR)
    maven {
        name = 'Create'
        url = 'https://maven.createmod.net/'
        content { includeGroup 'com.simibubi.create' }
    }
}
dependencies {
    implementation project(':core')
    // AeroCore's game JAR (its physics API inside); a required mod at run time.
    implementation "dev.mcmod.aerocore:aerocore-neoforge-1.21.1:${rootProject.aerocore_version}"
    // JEI is optional for players: hdfv only adds a plugin JEI loads when it is installed.
    compileOnly "mezz.jei:jei-1.21.1-common-api:${rootProject.jei_version}"
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:${rootProject.jei_version}"
    runtimeOnly "mezz.jei:jei-1.21.1-neoforge:${rootProject.jei_version}"
    // 0.23: Create, optional for players (hdfv's Create recipes carry neoforge:conditions mod_loaded create): in the
    // development runs so the recipes load and a GameTest checks them; -Phdfv_create=false runs without it
    if (providers.gradleProperty('hdfv_create').getOrElse('true') == 'true') {
        runtimeOnly("com.simibubi.create:create-1.21.1:${rootProject.create_version}") { transitive = false }
    }
}

// Keep game data local even on a network checkout (as AeroCore does): %USERPROFILE%\.mcmod\runs\<id>.
def runtimeId = providers.gradleProperty('hdfv_runtime_id').getOrElse('hdfv')
if (!(runtimeId ==~ /[A-Za-z0-9_-]+/)) { throw new GradleException('Invalid hdfv_runtime_id') }
def localRuntimeRoot = new File(System.getProperty('user.home'), ".mcmod/runs/${runtimeId}")
// Java NIO pipes use Unix-domain sockets in the temp directory on Windows; a redirected %TEMP% breaks them
// (the second development computer crashes creating a world without this), so every run uses the same local temp folder as dev.ps1.
def localTemp = new File(System.getProperty('user.home'), '.mcmod/tmp')
localTemp.mkdirs()
tasks.withType(net.neoforged.nfrtgradle.NeoFormRuntimeTask).configureEach {
    workDirectory = new File(gradle.gradleUserHomeDir, "caches/hdfv-work/${runtimeId}/${project.name}")
}
// AeroCore 0.33.1 (DevWindow): the development clients open on this monitor (1 the primary) without taking focus or the
// mouse, out of the way of a game being played on the primary monitor; -Pdev_window_monitor=0 opens them as usual.
def devWindowMonitor = providers.gradleProperty('dev_window_monitor').getOrElse('2')
if (!(devWindowMonitor ==~ /\d+/)) { throw new GradleException('Invalid dev_window_monitor') }
// NeoForge's early loading window opens on the primary monitor and takes focus before any mod runs: the client runs
// turn it off in their own config/fml.toml (FML fills in the other keys), so the game's window is the first one.
def quietEarlyWindow = { File gameDirectory ->
    if (devWindowMonitor == '0') { return }
    def toml = new File(gameDirectory, 'config/fml.toml')
    def text = toml.isFile() ? toml.getText('UTF-8') : ''
    def line = /(?m)^earlyWindowControl\s*=.*$/
    def quiet = text =~ line ? text.replaceAll(line, 'earlyWindowControl = false')
            : text + (text.isEmpty() || text.endsWith('\n') ? '' : '\n') + 'earlyWindowControl = false\n'
    if (quiet != text) {
        toml.parentFile.mkdirs()
        toml.setText(quiet, 'UTF-8')
    }
}

neoForge {
    version = rootProject.neo_version
    runs {
        client {
            client()
            gameDirectory = file(new File(localRuntimeRoot, 'client'))
            systemProperty 'aerocore.window.monitor', devWindowMonitor
        }
        // 0.14: a second player for multiplayer checks against the server run (its own folder and name: two clients
        // both called Dev would push each other off the server)
        client2 {
            client()
            gameDirectory = file(new File(localRuntimeRoot, 'client2'))
            programArgument '--username'
            programArgument 'Dev2'
            systemProperty 'aerocore.window.monitor', devWindowMonitor
        }
        server {
            server()
            gameDirectory = file(new File(localRuntimeRoot, 'server'))
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = file(new File(localRuntimeRoot, 'gametest'))
            systemProperty 'neoforge.enabledGameTestNamespaces', 'hdfv'
            systemProperty 'hdfv.gametests', 'true'
            // calm world wind (AeroCore's WorldWind), as in AeroCore's own GameTests
            systemProperty 'aerocore.gametests', 'true'
        }
        configureEach {
            systemProperty 'java.io.tmpdir', localTemp.absolutePath
            systemProperty 'jdk.net.unixdomain.tmpdir', localTemp.absolutePath
        }
    }
    mods {
        hdfv {
            sourceSet sourceSets.main
            sourceSet project(':core').sourceSets.main
        }
    }
}

tasks.matching { it.name == 'runClient' || it.name == 'runClient2' }.configureEach { task ->
    def folder = task.name == 'runClient2' ? 'client2' : 'client'
    task.doFirst { quietEarlyWindow(new File(localRuntimeRoot, folder)) }
}

tasks.register('showRuntimeDirectories') {
    // where the game loads AeroCore from (the local mirror unless -Phdfv_local_build=false; root build.gradle)
    def aerocoreJars = configurations.runtimeClasspath.incoming.artifactView {
        componentFilter { it instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier && it.group == 'dev.mcmod.aerocore' }
    }.files
    doLast {
        println "hdfv client: ${new File(localRuntimeRoot, 'client')}"
        println "hdfv second client: ${new File(localRuntimeRoot, 'client2')}"
        println "hdfv server: ${new File(localRuntimeRoot, 'server')}"
        println "hdfv GameTest: ${new File(localRuntimeRoot, 'gametest')}"
        println "hdfv build outputs: ${layout.buildDirectory.get().asFile}"
        aerocoreJars.each { println "AeroCore: ${it}" }
    }
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    // AeroCore's API changes with each minor version: accept the one built against up to the next minor
    def aerocore = rootProject.aerocore_version.tokenize('.')
    def properties = [mod_version: project.version, neo_version: rootProject.neo_version, aerocore_version: rootProject.aerocore_version,
                      aerocore_next: "${aerocore[0]}.${aerocore[1].toInteger() + 1}.0".toString()]
    inputs.properties properties
    expand properties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/modMetadata')
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// One JAR for players: the platform-independent core inside the mod.
tasks.named('jar') { from project(':core').sourceSets.main.output }
tasks.named('sourcesJar') { from project(':core').sourceSets.main.allSource }
