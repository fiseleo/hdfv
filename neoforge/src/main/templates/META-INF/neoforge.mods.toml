[[mods]]
modId="hdfv"
version="${mod_version}"
displayName="High Degree of Freedom Vehicles"
authors="fiseleo"
credits="Physics by AeroCore."
displayURL="https://github.com/fiseleo/hdfv"
logoFile="hdfv_logo.png"
description='''
Design every part yourself - engines from block and crank to turbine and nozzle, wings, hulls, bodies, chassis,
wheels and gearboxes - make them in a workshop of real machine tools, and build vehicles for land, sea and air in
assembly rooms. The Vehicle Engineering Handbook and the advancements show the way.

Discord: https://discord.gg/4y2mubMg7e
'''

