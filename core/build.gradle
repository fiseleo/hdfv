plugins {
    id 'java-library'
    // 0.24: TestCars and SoundBench (unit tests and the development runs' dev source set, not the release JAR)
    id 'java-test-fixtures'
}

base { archivesName = 'hdfv-core' }
dependencies {
    // The game JAR of AeroCore carries the same classes, so the physics JAR is for compiling and tests only.
    compileOnly "dev.mcmod.aerocore:aerocore-physics:${rootProject.aerocore_version}"
    testFixturesCompileOnly "dev.mcmod.aerocore:aerocore-physics:${rootProject.aerocore_version}"
    testImplementation "dev.mcmod.aerocore:aerocore-physics:${rootProject.aerocore_version}"
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// 0.11: asset checks (FinishAssetsTest and others) read the mod's resources and the Blender specs from the project root
// 0.24: and they rerun when only those change (the handbook's pages and pictures, the language files)
tasks.named('test') {
    systemProperty 'hdfv.root', rootProject.projectDir.absolutePath
    inputs.dir(rootProject.file('neoforge/src/main/resources')).withPropertyName('modResources').withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.files(rootProject.fileTree('tools') { include '**/*.json' }).withPropertyName('toolSpecs').withPathSensitivity(PathSensitivity.RELATIVE)
}
